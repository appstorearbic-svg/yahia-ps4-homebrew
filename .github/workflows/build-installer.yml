name: Build Yahia PS4 File Installer 1.53

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-installer.yml'
      - 'src/yahia-ps4-installer/**'
      - 'tools/fix_gp4_dirs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl tar libssl3 libssl-dev
          curl -L --fail --retry 3 -o /tmp/libssl1.1.deb \
            https://deb.debian.org/debian/pool/main/o/openssl/libssl1.1_1.1.1w-0+deb11u1_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Download OpenOrbis Toolchain
        run: |
          mkdir -p tools
          curl -L --fail --retry 3 -o /tmp/openorbis.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C tools

      - name: Build installer PKG
        run: |
          export OO_PS4_TOOLCHAIN="$GITHUB_WORKSPACE/tools/OpenOrbis/PS4Toolchain"
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
          cd src/yahia-ps4-installer
          make -j2
          mkdir -p "$GITHUB_WORKSPACE/finish"
          cp -f IV0000-YAHI00002_00-INSTALLER0000000.pkg \
            "$GITHUB_WORKSPACE/finish/Yahia-PS4-File-Installer-1.53.pkg"

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yahia-PS4-File-Installer-1.53
          path: finish/Yahia-PS4-File-Installer-1.53.pkg
          if-no-files-found: error
          retention-days: 30

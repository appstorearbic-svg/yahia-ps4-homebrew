name: Build Yahia PS4 PKG
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git curl tar libssl3 libssl-dev
          curl -L --fail -o /tmp/libssl1.1.deb https://deb.debian.org/debian/pool/main/o/openssl/libssl1.1_1.1.1w-0+deb11u1_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Download OpenOrbis
        run: |
          mkdir -p tools
          git clone --depth=1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git tools/OpenOrbis-PS4-Toolchain
          curl -L --fail --retry 3 -o tools/toolchain.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          tar -xzf tools/toolchain.tar.gz -C tools

      - name: Prepare project
        run: |
          SDK="$GITHUB_WORKSPACE/tools/OpenOrbis/PS4Toolchain"
          APP="$GITHUB_WORKSPACE/src/yahia-dialog-test"

          cp -f "$SDK/samples/dialogs/sce_module/"* "$APP/sce_module/" 2>/dev/null || true
          mkdir -p "$APP/sce_sys/about"

          sed -i 's/^PROJDIR.*/PROJDIR     := dialogs/' "$APP/Makefile"
          sed -i 's#eboot.bin sce_sys/about/right.sprx#eboot.bin#' "$APP/Makefile"

          sed -i '/    \/\/ Show a message dialog/,/    for(;;);/c\
          show_dialog(MDIALOG_OK, "Welcome Yahya - Experimental Test");\
          for(;;);' "$APP/dialogs/main.c"

      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN="$GITHUB_WORKSPACE/tools/OpenOrbis/PS4Toolchain"
          export PATH="/usr/bin:$PATH"
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          cd src/yahia-dialog-test
          make -j2
          mkdir -p "$GITHUB_WORKSPACE/finish"
          cp -f ./*.pkg "$GITHUB_WORKSPACE/finish/Yahia-Dialog-Test.pkg"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: Yahia-Dialog-Test
          path: finish/Yahia-Dialog-Test.pkg

name: Build GTXMOD Mod Installer
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-mod-installer.yml'
      - 'src/gtxmod-mod-installer/**'
      - 'tools/create_gp4_from_tree.py'
      - 'tools/fix_gp4_dirs.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Checkout libun7zip
        uses: actions/checkout@v4
        with:
          repository: bucanero/libun7zip
          path: libun7zip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev unar clang lld make curl tar libssl3 libssl-dev
          curl -L --fail --retry 3 -o /tmp/libssl1.1.deb \
            https://deb.debian.org/debian/pool/main/o/openssl/libssl1.1_1.1.1w-0+deb11u1_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - name: Download OpenOrbis Toolchain
        run: |
          mkdir -p tools
          curl -L --fail --retry 3 -o /tmp/openorbis.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C tools
      - name: Install libun7zip
        working-directory: libun7zip
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/tools/OpenOrbis/PS4Toolchain
        run: |
          set -e
          mkdir -p build-ps4
          for src in source/*.c; do
            obj="build-ps4/$(basename "${src%.c}").o"
            clang --target=x86_64-pc-freebsd12-elf \
              -fPIC -funwind-tables -c "$src" -o "$obj" \
              -Iinclude \
              -isysroot "$OO_PS4_TOOLCHAIN" \
              -isystem "$OO_PS4_TOOLCHAIN/include" \
              -DLITTLE_ENDIAN -D_FILE_OFFSET_BITS=64 \
              -D_LARGEFILE_SOURCE -DRARDLL
          done
          ar rcs build-ps4/libun7zip.a build-ps4/*.o
          cp build-ps4/libun7zip.a "$OO_PS4_TOOLCHAIN/lib/libun7zip.a"
          cp include/7zExtractor.h "$OO_PS4_TOOLCHAIN/include/un7zip.h"
      - name: Build GTXMOD Mod Installer PKG
        run: |
          export OO_PS4_TOOLCHAIN="$GITHUB_WORKSPACE/tools/OpenOrbis/PS4Toolchain"
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
          cd src/gtxmod-mod-installer
          make -j2
          mkdir -p "$GITHUB_WORKSPACE/finish"
          cp -f IV0000-YAHI00003_00-GTXMODINSTAL0001.pkg \
            "$GITHUB_WORKSPACE/finish/GTXMOD-Mod-Installer.pkg"
      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTXMOD-Mod-Installer-PS4
          path: finish/GTXMOD-Mod-Installer.pkg
          if-no-files-found: error
          retention-days: 30
